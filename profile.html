<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Profile | SyncSpace</title>
    <meta name="description" content="Manage your SyncSpace profile, view booking history, and update your account details.">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="SyncSpace home">
        <img src="assets/syncspace-logo-mark.png" alt="SyncSpace Coworking Space">
      </a>
      <nav class="main-nav" aria-label="Primary navigation">
        <a href="index.html#about">About</a>
        <a href="index.html#spaces">Spaces</a>
        <a href="index.html#benefits">Benefits</a>

        <a class="nav-cta" href="booking.html">
          Book a Space
          </a>

        <a
          href="profile.html"
          id="navProfile"
          class="nav-profile"
          style="display:none">
          Profile
        </a>

        <button
          type="button"
          id="navLogin"
          class="nav-login">
          Log in
        </button>

        <button
          type="button"
          id="navLogout"
          class="nav-logout"
          style="display:none">
          Log out
        </button>
      </nav>
    </header>

    <main>
      <section class="profile-header">
        <div>
          <p class="eyebrow">Account</p>
          <h1>My Profile</h1>
        </div>
      </section>

      <section class="profile-content">
        <div class="profile-card">
          <div class="profile-avatar" id="profileAvatar">
            <span id="avatarInitials">SS</span>
          </div>
          <div class="profile-info">
            <h2 id="profileDisplayName"></h2>
            <p id="profileDisplayEmail" class="profile-email"></p>
            <div class="profile-actions">
              <a class="button secondary" href="#" data-auth-logout>Log out</a>
            </div>
          </div>
        </div>

        <div class="bookings-card">
          <div class="bookings-header">
            <div>
              <p class="eyebrow">Upcoming</p>
              <h2>Upcoming Reservations</h2>
            </div>
          </div>
          <div id="upcomingList" class="bookings-list">
            <div class="empty-state">No upcoming reservations. <a href="booking.html">Book a room</a> to get started.</div>
          </div>
        </div>

        <div class="bookings-card">
          <div class="bookings-header">
            <div>
              <p class="eyebrow">History</p>
              <h2>Past Reservations</h2>
            </div>
          </div>
          <div id="pastList" class="bookings-list">
            <div class="empty-state">No past reservations yet.</div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>SyncSpace</span>
      <span>Account and reservation data are managed through Supabase.</span>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
      defer>
    </script>
    <script src="supabase-client.js" defer></script>
    <script src="auth.js" defer></script>
    <script src="profile.js" defer></script>
  </body>
</html>
